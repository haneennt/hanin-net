<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة حنين نت</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">لوحة إدارة <b>حنين نت</b></div><a href="/" style="color:#fff">المتجر</a></header><main><section id="login"><h2>دخول الإدارة</h2><div class="box"><input id="user" placeholder="اسم المستخدم"><input id="pass" type="password" placeholder="كلمة المرور"><button class="button" onclick="login()">دخول</button><p id="loginMsg"></p></div></section><section id="dash" style="display:none"><h2>الطلبات</h2><div class="box"><h3>إضافة كود</h3><select id="plan"><option value="daily">يومي</option><option value="weekly">أسبوعي</option><option value="fifteen">15 يوم</option></select><input id="code" placeholder="كود الإنترنت"><button class="button" onclick="addCode()">إضافة</button></div><div id="orders"></div><h2>الأكواد</h2><div id="cards"></div></section></main><script>
async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:user.value,password:pass.value})});if(r.ok){login.style.display='none';dash.style.display='block';load()}else loginMsg.textContent='بيانات الدخول غير صحيحة'}async function load(){let [o,c]=await Promise.all([fetch('/api/admin/orders').then(x=>x.json()),fetch('/api/admin/cards').then(x=>x.json())]);orders.innerHTML='<div class="box">'+o.map(x=>`<p><b>#${x.id} ${x.plan}</b> — ${x.name} — ${x.contact} — العملية: ${x.transaction_id} — <b>${x.status}</b> ${x.status==='pending'?`<button class="button" onclick="approve(${x.id})">تأكيد وتسليم</button> <button class="button" onclick="reject(${x.id})">رفض</button>`:x.card_code||''}</p>`).join('')+'</div>';cards.innerHTML='<div class="box">'+c.map(x=>`<p>${x.plan}: ${x.code} — ${x.used?'مستخدم':'متوفر'}</p>`).join('')+'</div>'}async function addCode(){await fetch('/api/admin/cards',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan:plan.value,code:code.value})});code.value='';load()}async function approve(id){let r=await fetch('/api/admin/orders/'+id+'/approve',{method:'POST'}).then(x=>x.json());alert(r.code?'تم التسليم: '+r.code:r.error);load()}async function reject(id){await fetch('/api/admin/orders/'+id+'/reject',{method:'POST'});load()}
</script></body></html>
